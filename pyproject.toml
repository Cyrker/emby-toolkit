[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "emby-toolkit"
dynamic = ["version"]
description = "embytool media management platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "apscheduler==3.11.3",
  "beautifulsoup4==4.15.0",
  "cachetools==7.1.7",
  "concurrent-log-handler==0.9.29",
  "croniter==6.2.4",
  "docker==7.2.0",
  "fastapi>=0.116,<1",
  "google-genai==2.19.0",
  "itsdangerous>=2.2,<3",
  "jinja2==3.1.6",
  "lxml==6.1.2",
  "numpy==2.5.2",
  "openai==3.3.1",
  "p115client==0.0.9.4.9.1",
  "p115oss==0.1.0.4",
  "p115pickcode==0.0.5.4",
  "pillow==12.3.0",
  "pydantic>=2,<3",
  "pypinyin==0.55.0",
  "python-socks[asyncio]==2.4.3",
  "pytz==2026.3.post1",
  "pyyaml==6.0.3",
  "starlette>=0.45,<2",
  "telethon==1.33.1",
  "urllib3>=2,<3",
  "uvicorn[standard]>=0.35,<1",
  "watchdog==6.0.0",
  "websocket-client==1.9.0",
  "werkzeug>=3.1,<4",
  "zhipuai==2.1.5.20250825",
  "alembic>=1,<2",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3,<4",
  "psycopg-pool>=3,<4",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "structlog>=25,<26",
  "celery>=5,<6",
  "redis>=7,<8",
]

[project.scripts]
embytool = "etk.bootstrap.cli:main"
etk = "etk.bootstrap.cli:main"

[dependency-groups]
dev = [
  # Legacy verification fixtures only; the native runtime does not install these packages.
  "flask==3.1.3",
  "gevent-websocket==0.10.1",
  "gevent==26.8.0",
  "psycopg2-binary==2.9.12",
  "requests==2.34.2",
  "httpx>=0.28,<1",
  "pyright>=1.1.408,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
  "testcontainers[postgres]>=4,<5",
]

[tool.hatch.version]
path = "constants.py"
pattern = 'APP_VERSION = "(?P<version>[^\"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/etk"]

[tool.pytest.ini_options]
addopts = "-ra"
python_files = ["test_*.py"]
pythonpath = ["."]
testpaths = ["verification"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
include = ["main.py", "src/etk", "verification/application"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
