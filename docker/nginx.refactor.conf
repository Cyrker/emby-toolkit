map $http_upgrade $etk_connection_upgrade {
    default upgrade;
    '' close;
}

upstream etk_native_proxy {
    server proxy:7758;
    keepalive 32;
}

upstream etk_api {
    server api:5257;
    keepalive 16;
}

server {
    listen 0.0.0.0:8097;
    listen [::]:8097;
    server_name _;

    location ^~ /api/p115/ {
        proxy_pass http://etk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $etk_connection_upgrade;
        proxy_pass_request_headers on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Emby Web sets crossorigin on video elements; 115 CDN does not return CORS headers.
    location ~ ^/web/?(?:index\.html)?$ {
        proxy_pass http://etk_native_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $etk_connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_pass_request_headers on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        sub_filter_once on;
        sub_filter "</head>" "<script>(function(){function isMedia(el){return el instanceof HTMLMediaElement;}var proto=HTMLMediaElement.prototype;try{Object.defineProperty(proto,'crossOrigin',{configurable:true,get:function(){return null;},set:function(){this.removeAttribute('crossorigin');}});}catch(e){}var setAttribute=Element.prototype.setAttribute;Element.prototype.setAttribute=function(name,value){if(isMedia(this)&&String(name).toLowerCase()==='crossorigin')return;return setAttribute.apply(this,arguments);};})();</script></head>";
        proxy_hide_header ETag;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /web/modules/htmlvideoplayer/plugin.js {
        proxy_pass http://etk_native_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $etk_connection_upgrade;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Accept-Encoding "";
        proxy_pass_request_headers on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        sub_filter_types application/javascript text/javascript application/x-javascript text/plain;
        sub_filter_once off;
        sub_filter "initialSubtitleStream&&(elem.crossOrigin=initialSubtitleStream);" "elem.removeAttribute('crossorigin');";
        proxy_hide_header ETag;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        proxy_pass http://etk_native_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $etk_connection_upgrade;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_pass_request_headers on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
