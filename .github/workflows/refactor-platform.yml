name: Refactor PostgreSQL and Task Platform

on:
  pull_request:
  push:
    branches:
      - codex/refactor-mainline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: etk
          POSTGRES_USER: etk
          POSTGRES_PASSWORD: etk-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etk -d etk"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      ETK_DATABASE_URL: postgresql+psycopg://etk:etk-ci-only@127.0.0.1:5432/etk
      ETK_TEST_DATABASE_URL: postgresql+psycopg://etk:etk-ci-only@127.0.0.1:5432/etk
      ETK_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==0.11.3"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run P4 frontend behavior tests
        run: node --test verification/application/p4/test_quick_deploy_intent.mjs verification/application/p4/test_config_diff.mjs

      - name: Lint and type-check platform slice
        run: |
          uv run ruff check src/etk/platform src/etk/processes src/etk/bootstrap src/etk/domains/operations scripts/refactor/compare_schema.py verification/unit/platform verification/integration/platform verification/integration/p4 verification/application/p2 verification/application/p4
          uv run ruff format --check src/etk/platform src/etk/processes src/etk/bootstrap src/etk/domains/operations scripts/refactor/compare_schema.py verification/unit/platform verification/integration/platform verification/integration/p4 verification/application/p2 verification/application/p4
          uv run pyright src/etk/platform src/etk/processes src/etk/bootstrap src/etk/domains/operations scripts/refactor/compare_schema.py verification/unit/platform verification/integration/platform verification/integration/p4 verification/application/p2 verification/application/p4

      - name: Validate Greenfield Compose
        run: docker compose -f docker/compose.refactor.yml config -q

      - name: Run platform unit and application tests
        run: uv run pytest verification/unit/platform verification/application/p2 verification/application/p4 -q

      - name: Upgrade empty PostgreSQL 18 database to legacy baseline
        run: uv run alembic upgrade 0001_p2_legacy_baseline

      - name: Compare PostgreSQL catalog
        run: >-
          uv run python scripts/refactor/compare_schema.py
          verification/contracts/db/legacy-pg-catalog.json
          "$ETK_DATABASE_URL"

      - name: Upgrade PostgreSQL 18 database to P4 head
        run: uv run alembic upgrade head

      - name: Run platform integration tests
        env:
          ETK_RUN_CELERY_REDIS_INTEGRATION: "1"
        run: uv run pytest verification/integration/platform verification/integration/p4 -q
